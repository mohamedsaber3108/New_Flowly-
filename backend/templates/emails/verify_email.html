{% extends "emails/base.html" %}
{% block content %}
<p>Hi {{ name }},</p>
<p>Please confirm your email address to finish creating your Flowly account.</p>
<p><a href="{{ link }}" style="display:inline-block;background:#9333ea;color:#fff;padding:10px 18px;border-radius:8px;text-decoration:none">Verify email</a></p>
<p style="font-size:13px;color:#6b6685">Or open this link: {{ link }}<br>The link expires in 3 days.</p>
{% endblock %}
