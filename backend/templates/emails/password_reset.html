{% extends "emails/base.html" %}
{% block content %}
<p>Hi {{ name }},</p>
<p>We received a request to reset your Flowly password.</p>
<p><a href="{{ link }}" style="display:inline-block;background:#9333ea;color:#fff;padding:10px 18px;border-radius:8px;text-decoration:none">Choose a new password</a></p>
<p style="font-size:13px;color:#6b6685">Or open this link: {{ link }}<br>If you did not ask for this, nothing changes unless you open the link.</p>
{% endblock %}
