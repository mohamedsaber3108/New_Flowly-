<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Choose a new password · Flowly</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f4f8;font-family:Arial,Helvetica,sans-serif;color:#1b1630}
    main{width:min(420px,92vw);background:#fff;border-radius:12px;padding:28px;box-shadow:0 4px 24px rgba(30,20,60,.08)}
    h1{font-size:20px;margin:0 0 12px}
    label{display:block;font-size:14px;margin:12px 0 4px}
    input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #cfc9e0;border-radius:8px;font-size:15px}
    button{margin-top:16px;width:100%;padding:11px;border:0;border-radius:8px;background:#9333ea;color:#fff;font-size:15px;cursor:pointer}
    button:focus-visible,input:focus-visible{outline:3px solid #c084fc;outline-offset:2px}
    .err{color:#b00020;font-size:13px;margin:4px 0}
  </style>
</head>
<body>
<main>
  <h1>Choose a new password</h1>
  {% if validlink %}
    <form method="post">
      {% csrf_token %}
      <label for="id_new_password1">New password</label>
      <input type="password" name="new_password1" id="id_new_password1" autocomplete="new-password" required>
      {% for error in form.new_password1.errors %}<p class="err" role="alert">{{ error }}</p>{% endfor %}
      <label for="id_new_password2">Confirm new password</label>
      <input type="password" name="new_password2" id="id_new_password2" autocomplete="new-password" required>
      {% for error in form.new_password2.errors %}<p class="err" role="alert">{{ error }}</p>{% endfor %}
      <button type="submit">Save password</button>
    </form>
  {% else %}
    <p role="alert">This reset link is invalid or has expired.</p>
    <p><a href="/account/#forgot">Request a new link</a></p>
  {% endif %}
</main>
</body>
</html>
