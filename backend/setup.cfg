[flake8]
max-line-length = 120
exclude = .venv,migrations,__pycache__,staticfiles,media,logs
extend-ignore = E203,W503
per-file-ignores =
    apps/leads/assistant.py:E501

[isort]
profile = black
line_length = 120
skip = .venv,migrations,staticfiles
known_first_party = apps,config

[tool:black]
line-length = 120
