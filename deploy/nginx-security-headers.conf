# Flowly security headers. render-nginx.sh copies this to /etc/nginx/snippets/flowly-security-headers.conf.
# Included at server level AND inside every location that sets its own add_header, because nginx drops
# inherited add_header directives in any location that declares one of its own.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
