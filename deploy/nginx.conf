# Flowly - Nginx site. ec2-setup.sh substitutes __DOMAIN__, __BACKEND_DIR__, __MEDIA_DIR__, __FRONTEND_DIR__.
# TLS certificate paths live in /etc/nginx/snippets/flowly-ssl.conf (temporary self-signed until
# deploy/ssl-setup.sh switches it to Let's Encrypt).

limit_req_zone $binary_remote_addr zone=flowly_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=flowly_auth:10m rate=5r/s;

upstream flowly_gunicorn {
    server 127.0.0.1:8000 fail_timeout=0;
}

# --- HTTP: ACME challenge + redirect to HTTPS -------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS ------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __DOMAIN__ www.__DOMAIN__;
    http2 on;

    include /etc/nginx/snippets/flowly-ssl.conf;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml application/json application/javascript text/javascript
               application/xml image/svg+xml font/ttf font/otf;

    client_max_body_size 20M;
    proxy_read_timeout 60s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;

    # Common proxy headers. X-Forwarded-For is SET (not appended) so clients cannot spoof their IP
    # (Django trusts exactly one proxy: NUM_PROXIES=1).
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;

    # --- Django: auth endpoints (tighter burst) ---
    location /api/v1/auth/ {
        limit_req zone=flowly_auth burst=15 nodelay;
        proxy_pass http://flowly_gunicorn;
    }

    # --- Django: API, docs, health, admin, account portal, password reset, SEO files ---
    location /api/ {
        limit_req zone=flowly_api burst=40 nodelay;
        proxy_pass http://flowly_gunicorn;
    }
    location /health/ { proxy_pass http://flowly_gunicorn; }
    location /account/ { proxy_pass http://flowly_gunicorn; }
    location /accounts/ { proxy_pass http://flowly_gunicorn; }
    location = /robots.txt { proxy_pass http://flowly_gunicorn; }
    location = /sitemap.xml { proxy_pass http://flowly_gunicorn; }
    # The Django admin lives at the secret ADMIN_URL path from backend/.env (render-nginx.sh substitutes it).
    location /__ADMIN_URL__ {
        proxy_pass http://flowly_gunicorn;
    }

    # --- Static (WhiteNoise-collected) and uploaded media, served directly ---
    location /static/ {
        alias __BACKEND_DIR__/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    location /media/ {
        alias __MEDIA_DIR__/;
        expires 7d;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'none'; sandbox" always;
        # Uploads are validated as images; never execute anything from here.
        location ~* \.(php|py|pl|sh|cgi)$ { return 403; }
    }

    # --- React frontend (single-page app) ---
    root __FRONTEND_DIR__;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }
    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
