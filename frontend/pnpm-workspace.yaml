# Copied Sites are standalone projects and cannot inherit the monorepo policy.
minimumReleaseAge: 10080
minimumReleaseAgeIgnoreMissingTime: false
trustLockfile: false
strictDepBuilds: true
allowBuilds:
  esbuild: true
  fsevents: true
  sharp: true
  unrs-resolver: true
  workerd: true
storeDir: ${SITES_PNPM_SHARED_STORE:-.sites-runtime/pnpm-store}
cacheDir: ${SITES_PNPM_SHARED_STORE:-.sites-runtime/pnpm-store}/policy-cache
enableGlobalVirtualStore: false
# Reuse store files with clones or hardlinks before falling back to copies.
packageImportMethod: auto
# The explicit installer owns dependency setup, including restored workspaces.
verifyDepsBeforeRun: false
optimisticRepeatInstall: false
overrides:
  miniflare>sharp: 0.35.5
  # Security pins for transitive packages (same major as before); see PR #1.
  brace-expansion@^1.0.0: 1.1.20
  brace-expansion@^5.0.0: 5.0.11
  browserslist@^4.0.0: 4.28.7
  image-size@^2.0.0: 2.0.3
  js-yaml@^4.0.0: 4.3.2
  source-map-js@^1.0.0: 1.2.2
  undici@^7.0.0: 7.30.1
  ws@^8.0.0: 8.21.0
# The zod advisory (GHSA-mrhx-c7xc-m3w5) is ignored in one place only: the `pnpm audit --ignore` flag in
# .github/workflows/ci.yml, next to its explanation. Do not add it here again. Note: pnpm 11 itself writes an
# `auditConfig.ignoreGhsas` entry into this file when `pnpm audit --ignore ...` is run on a developer machine;
# delete that entry before committing (in CI the file is not committed back, so the flag alone is enough).
