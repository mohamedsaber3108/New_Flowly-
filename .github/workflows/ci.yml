name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "flowly/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, migrations, tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: flowly
          POSTGRES_PASSWORD: flowly-ci-only
          POSTGRES_DB: flowly
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flowly"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: postgres://flowly:flowly-ci-only@localhost:5432/flowly
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - name: Install dependencies
        run: pip install -r requirements/test.txt
      - name: flake8
        if: ${{ !cancelled() }}
        run: flake8 .
      - name: black --check
        if: ${{ !cancelled() }}
        run: black --check .
      - name: isort --check
        if: ${{ !cancelled() }}
        run: isort --check-only .
      - name: Migrations are up to date
        if: ${{ !cancelled() }}
        run: python manage.py makemigrations --check --dry-run
      - name: pytest
        if: ${{ !cancelled() }}
        run: pytest

  frontend:
    name: Frontend (types, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm exec tsc --noEmit -p tsconfig.json
      - name: Build
        run: pnpm exec vite build --config portable/vite.config.ts
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/ec2-dist/public
          if-no-files-found: error

  security:
    name: Security scans
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (full history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        if: ${{ !cancelled() }}
        with:
          python-version: "3.12"
      - name: pip-audit
        if: ${{ !cancelled() }}
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements/production.txt
      - uses: pnpm/action-setup@v4
        if: ${{ !cancelled() }}
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        if: ${{ !cancelled() }}
        with:
          node-version: "22"
      - name: pnpm audit
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: pnpm audit --audit-level high
