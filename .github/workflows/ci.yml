name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "flowly/**"

concurrency:
  group: ci-${{ github.ref }}
  # Only a newer push to a pull request replaces its older run. A push to main or a flowly/** branch always finishes,
  # so a merge is never left without its full result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, migrations, tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: flowly
          POSTGRES_PASSWORD: flowly-ci-only
          POSTGRES_DB: flowly
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flowly"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: postgres://flowly:flowly-ci-only@localhost:5432/flowly
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - name: Install dependencies
        # test.txt has no Postgres driver (it is only in production.txt), so pin the same one here.
        run: pip install -r requirements/test.txt "psycopg[binary]==3.2.12"
      - name: flake8
        if: ${{ !cancelled() }}
        run: flake8 .
      - name: black --check
        if: ${{ !cancelled() }}
        run: black --check .
      - name: isort --check
        if: ${{ !cancelled() }}
        run: isort --check-only .
      - name: Migrations are up to date
        if: ${{ !cancelled() }}
        run: python manage.py makemigrations --check --dry-run
      - name: Migrate the scratch database
        if: ${{ !cancelled() }}
        run: python manage.py migrate --noinput
      - name: Audit table is insert-only for the app role (deploy/sql/audit_grants.sql)
        # The Postgres service user "flowly" is a superuser here and plays "the postgres user" of the server.
        # The script creates a throwaway LOGIN role as the app role, runs the grants file twice, then checks that
        # INSERT/SELECT work and UPDATE/DELETE/TRUNCATE/ALTER/DROP/GRANT are refused. Any wrong result fails the job.
        if: ${{ !cancelled() }}
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: flowly
          PGPASSWORD: flowly-ci-only
          PGDATABASE: flowly
        run: bash ../deploy/sql/check_audit_grants.sh
      - name: pytest
        if: ${{ !cancelled() }}
        run: pytest

  frontend:
    name: Frontend (types, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        if: ${{ !cancelled() }}
        run: pnpm exec tsc --noEmit -p tsconfig.json
      - name: ESLint (includes jsx-a11y accessibility rules; errors fail, warnings are the TODO list in eslint.config.mjs)
        if: ${{ !cancelled() }}
        # --quiet prints errors only: the 825 warnings (mostly dense generated-style code) would fill the log.
        run: pnpm lint --quiet
      - name: Build
        id: build
        if: ${{ !cancelled() }}
        run: pnpm exec vite build --config portable/vite.config.ts
      - name: Upload build
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/ec2-dist/public
          if-no-files-found: error

  security:
    name: Security scans
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (full history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        if: ${{ !cancelled() }}
        with:
          python-version: "3.12"
      - name: pip-audit
        if: ${{ !cancelled() }}
        run: |
          pip install pip-audit
          # Documented ignores: advisories whose only fix is a MAJOR version bump (not done in this PR).
          #   Pillow 12.3.0 -> fixed only in 13.0.0 (43 ids, listed below, all PYSEC-2026-43xx / CVE-2026-*).
          #   cryptography 46.0.7 -> fixed only in 48.0.1 / 49.0.0 / 50.0.0 (GHSA-537c-gmf6-5ccf, PYSEC-2026-3552..3554).
          # Remove an id from this list when its major bump lands. Tracked as a follow-up task.
          ignore=(
            CVE-2026-112390 CVE-2026-112391 CVE-2026-112393 CVE-2026-112395 CVE-2026-112399
            CVE-2026-112400 CVE-2026-112401 CVE-2026-112404 CVE-2026-112406 CVE-2026-112891
            CVE-2026-112892 CVE-2026-112893 CVE-2026-112894 CVE-2026-112895 CVE-2026-112897
            CVE-2026-112899 CVE-2026-112900 CVE-2026-128066 CVE-2026-128067 CVE-2026-96638
            CVE-2026-96640 CVE-2026-96778 GHSA-78g4-xqwv-q3g8
            PYSEC-2026-4326 PYSEC-2026-4327 PYSEC-2026-4328 PYSEC-2026-4329 PYSEC-2026-4330
            PYSEC-2026-4331 PYSEC-2026-4332 PYSEC-2026-4333 PYSEC-2026-4334 PYSEC-2026-4335
            PYSEC-2026-4336 PYSEC-2026-4337 PYSEC-2026-4338 PYSEC-2026-4339 PYSEC-2026-4340
            PYSEC-2026-4341 PYSEC-2026-4342 PYSEC-2026-4343 PYSEC-2026-4363
            GHSA-537c-gmf6-5ccf PYSEC-2026-3552 PYSEC-2026-3553 PYSEC-2026-3554
          )
          args=()
          for id in "${ignore[@]}"; do args+=(--ignore-vuln "$id"); done
          pip-audit -r backend/requirements/production.txt "${args[@]}"
      - uses: pnpm/action-setup@v4
        if: ${{ !cancelled() }}
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        if: ${{ !cancelled() }}
        with:
          node-version: "22"
      - name: pnpm audit
        if: ${{ !cancelled() }}
        working-directory: frontend
        # No ignore: the zod advisory (GHSA-mrhx-c7xc-m3w5) is fixed by zod 4.6.6. Add a documented ignore only for a
        # new advisory that has no fix yet.
        run: pnpm audit --audit-level high
